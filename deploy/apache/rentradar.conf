# RentRadar SaaS — Apache reverse proxy vhost.
#
# Apache does NOT serve the project from disk: it forwards HTTP to the uvicorn
# process on 127.0.0.1:8000. The FastAPI app serves both the JSON API and the
# React SPA (dist/). The project must NOT live under any DocumentRoot.
#
# Required modules (run once):
#   sudo a2enmod proxy proxy_http headers ssl rewrite
#   # mod_proxy_wstunnel is NOT needed — the app uses no websockets.
#
# TLS: obtain the cert first, e.g.
#   sudo certbot certonly --apache -d radar.tudominio.com
# then enable this site and reload:
#   sudo cp deploy/apache/rentradar.conf /etc/apache2/sites-available/
#   sudo a2ensite rentradar
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Replace radar.tudominio.com everywhere below with your real (sub)domain.

<VirtualHost *:80>
    ServerName radar.tudominio.com
    # Force HTTPS — the app sets Secure session cookies.
    RewriteEngine On
    RewriteRule ^/?(.*) https://radar.tudominio.com/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName radar.tudominio.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/radar.tudominio.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/radar.tudominio.com/privkey.pem

    # Pass the real Host + scheme through to the app (Secure-cookie awareness).
    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    # Everything goes to uvicorn — API and SPA alike.
    ProxyPass        / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    ErrorLog  ${APACHE_LOG_DIR}/rentradar_error.log
    CustomLog ${APACHE_LOG_DIR}/rentradar_access.log combined
</VirtualHost>
