      - "Ford Puma Hybrid"

  - code: EFAE
    display_name: SUV Urbano Eléctrico
    description: >
      Mini-SUV (~4,0–4,25 m), battery electric (BEV), automatic transmission.
      Mainstream brand. Entry-level electric SUV.
    criteria:
      - "Mini-SUV / urban crossover (length ~4,0–4,25 m)"
      - "Battery electric (BEV)"
      - "Automatic transmission (BEV always auto)"
      - "Mainstream brand"
    examples:
