    criteria:
      - "Wagon/estate body"
      - "B-segment / supermini platform base"
      - "Automatic transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "Škoda Fabia Combi Auto"

  - code: EFMR
    display_name: SUV Urbano Manual
    description: >
      Mini-SUV / urban crossover (~4,0–4,25 m), manual transmission, combustion
      engine. Supermini-based platform (B-segment). Entry-level SUV peldaño:
      below the Compact SUV tier (T-Roc/Kona = CFMR). Mainstream brand.
    criteria:
      - "Mini-SUV / urban crossover (length ~4,0–4,25 m)"
      - "Supermini-based platform (B-segment)"
      - "Raised driving position, soft-roader"
      - "Manual transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "SEAT Arona"
      - "Hyundai Bayon"
      - "VW T-Cross"
      - "Ford Puma"
      - "Kia Stonic"
      - "Opel Crossland"
      - "Citroën C3 Aircross"
      - "Nissan Juke"
      - "Renault Captur"
      - "Toyota Aygo X"

  - code: EFAR
    display_name: SUV Urbano Automático
    description: >
      Mini-SUV / urban crossover (~4,0–4,25 m), automatic transmission,
      combustion engine. Mainstream brand. Entry-level SUV peldaño.
    criteria:
      - "Mini-SUV / urban crossover (length ~4,0–4,25 m)"
      - "Supermini-based platform (B-segment)"
      - "Automatic transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "SEAT Arona Auto"
      - "Hyundai Bayon Auto"
      - "VW T-Cross Auto"
      - "Ford Puma Auto"
      - "Fiat 600"
      - "Jeep Avenger"
      - "Toyota Aygo X Auto"
      - "Nissan Juke Auto"
      - "Renault Captur Auto"

  - code: EFAH
    display_name: SUV Urbano Híbrido Automático
    description: >
      Mini-SUV (~4,0–4,25 m), hybrid powertrain (HEV), automatic transmission.
      Mainstream brand. Toyota Yaris Cross is almost always sold hybrid.
    criteria:
      - "Mini-SUV / urban crossover (length ~4,0–4,25 m)"
      - "Hybrid powertrain (mild or full HEV)"
      - "Automatic transmission"
      - "Mainstream brand"
    examples:
