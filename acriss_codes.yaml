  - code: DDMR
    display_name: Compacto Premium Manual
    description: >
      Premium-brand compact sedan/sportback/hatchback, manual transmission,
      combustion engine. C-segment size (~4,3–4,5 m) with premium brand.
      Espejo premium del CDMR (Golf/Focus). Audi A1 has moved to HDMR.
    criteria:
      - "Compact / C-segment size (~4,3–4,5 m)"
      - "Premium brand (Audi, BMW, Mercedes, Mini)"
      - "Sedan, sportback, or hatchback body (NOT SUV)"
      - "Manual transmission"
      - "Combustion engine"
    examples:
      - "Audi A3 (manual)"
      - "BMW Serie 1 (manual)"
      - "Mercedes Clase A (manual)"
      - "Mini Cooper (manual)"

  - code: DDAR
    display_name: Compacto Premium Automático
    description: >
      Premium-brand compact sedan/sportback/hatchback, automatic transmission,
      combustion engine. C-segment size (~4,3–4,5 m) with premium brand.
      Validated by Drivalia: Mini Cooper=DDAR ✓, A3=DDAR ✓. Audi A1 has
      moved to HDAR (Economy Elite — correct by size).
    criteria:
      - "Compact / C-segment size (~4,3–4,5 m)"
      - "Premium brand (Audi, BMW, Mercedes, Mini)"
      - "Sedan, sportback, or hatchback body (NOT SUV)"
      - "Automatic transmission"
      - "Combustion engine"
    examples:
      - "Audi A3"
      - "BMW Serie 1"
      - "Mercedes Clase A"
      - "Mini Cooper"

  - code: DFMR
    display_name: SUV Compacto Premium Manual
    description: >
      Premium-brand compact SUV (~4,3–4,5 m), manual transmission, combustion
      engine. Espejo SUV del DDMR. Audi Q2 has moved to HFMR; here sit Q3,
      GLA, X1, XC40.
    criteria:
      - "Compact premium SUV (~4,3–4,5 m)"
      - "Premium brand (Mercedes, Audi, BMW, Volvo)"
      - "Manual transmission"
      - "Combustion engine"
    examples:
      - "Mercedes GLA (manual)"
      - "Audi Q3 (manual)"
      - "BMW X1 (manual)"
      - "Volvo XC40 (manual)"

  - code: DFAR
    display_name: SUV Compacto Premium Automático
    description: >
      Premium-brand compact SUV (~4,3–4,5 m), automatic transmission, combustion
      engine. Espejo SUV del DDAR. Audi Q2 has moved to HFAR (sits below Q3 in
      Audi's range). Strictly 5-seat: 5+2/7-seat premium SUVs go to RFAR.
    criteria:
      - "Compact premium SUV (~4,3–4,5 m)"
      - "Premium brand (Mercedes, Audi, BMW, Volvo)"
      - "Automatic transmission"
      - "Combustion engine"
      - "5 seats only (5+2/7-seat configurations belong in RFAR)"
    examples:
      - "Mercedes GLA"
      - "Audi Q3"
      - "BMW X1"
      - "Volvo XC40"

  - code: DMAR
    display_name: Monovolumen Compacto Premium Automático
    description: >
      Premium-brand compact MPV (people-carrier), automatic transmission,
      combustion engine. Car-derived platform. Premium brand lifts it to
      Compact Elite tier.
    criteria:
      - "MPV/monospace body (NOT van, NOT SUV)"
      - "Premium brand (BMW)"
      - "Compact MPV size"
      - "Automatic transmission"
      - "Combustion engine"
    examples:
      - "BMW Serie 2 Active Tourer"

  - code: DTMR
    display_name: Compacto Premium Descapotable Manual
    description: >
      Premium-brand compact-based convertible, manual transmission, combustion
      engine. Platform inherits Compact Elite tier. Mini brand = premium → DTMR,
      not ETMR (which is eliminated).
    criteria:
      - "Convertible/cabrio body"
      - "Compact Elite / premium brand (Mini)"
      - "Manual transmission"
      - "Combustion engine"
    examples:
      - "Mini Cabrio (manual)"

  - code: DTAR
    display_name: Compacto Premium Descapotable Automático
    description: >
      Premium-brand compact-based convertible, automatic transmission, combustion
      engine. Platform inherits Compact Elite tier.
    criteria:
      - "Convertible/cabrio body"
      - "Compact Elite / premium brand (Mini)"
      - "Automatic transmission"
      - "Combustion engine"
    examples:
      - "Mini Cabrio Auto"

  # ──────────────────────────────────────────────────────────────
  # COMPACT (C) — C-segment: hatchback, eléctrico, SUV compacto, MPV, wagon, cabrio
