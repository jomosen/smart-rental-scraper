  - code: WFAR
    display_name: SUV Lujo Elite Automático
    description: >
      Luxury Elite giant SUV (~5,1+ m, typically 7 seats), automatic
      transmission, combustion engine. Premium brand. The largest SUV tier
      in the rental market.
    criteria:
      - "Giant luxury SUV (~5,1+ m, 7 seats)"
      - "Premium brand (Mercedes, BMW)"
      - "Automatic transmission"
      - "Combustion engine"
    examples:
      - "Mercedes GLS"
      - "BMW X7"

  - code: WVAR
    display_name: Furgoneta Pasajero Premium 9+ Plazas Automático
    description: >
      Premium-brand passenger van with 9+ fixed seats, automatic transmission,
      combustion engine. Upscale group transport / VIP.
    criteria:
      - "Commercial-derived van body"
      - "Premium brand (Mercedes)"
      - "9+ fixed passenger seats"
      - "Automatic transmission"
      - "Combustion engine"
    examples:
      - "Mercedes Vito Tourer 9"
      - "Mercedes Clase V 9 plazas"

  # ──────────────────────────────────────────────────────────────
  # 2-WHEELERS (Motorcycles / Scooters)
  # ──────────────────────────────────────────────────────────────

  - code: EYNR
    display_name: Scooter 125cc
    description: >
      Small-displacement scooter (typically 125cc), combustion engine. Common
      rental for urban mobility. Step-through design.
    criteria:
      - "Scooter body (step-through)"
      - "Engine displacement 125cc typically"
      - "Single-rider or two-rider"
    examples:
      - "Honda PCX 125"
      - "Yamaha NMAX 125"
      - "Vespa Primavera 125"
      - "Yamaha Ray ZR 125"
