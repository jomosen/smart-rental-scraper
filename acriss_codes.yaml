# ACRISS Codes — materialized subset for our market
#
# This file is the source of truth for the `acriss_codes` table. The seed
# script applies it idempotently. ACRISS itself is the canonical standard
# (https://www.acriss.org/); this file only declares which ACRISS codes we
# materialize for classification, with display names and LLM context.
#
# Each entry is a 4-character ACRISS code:
#   Position 1: Category (M=Mini, N=Mini Elite, E=Economy, H=Economy Elite,
#                C=Compact, D=Compact Elite, I=Intermediate, J=Intermediate Elite,
#                S=Standard, R=Standard Elite, F=Fullsize, G=Fullsize Elite,
#                P=Premium, U=Premium Elite, L=Luxury, W=Luxury Elite, X=Special)
#   Position 2: Body type (B=2-3 door, C=2/4 door, D=4/5 door hatchback/sedan,
#                W=wagon/estate, V=passenger van, L=limousine/gran coupé 4-door,
#                S=sport coupe, T=convertible/cabrio, F=SUV/4WD, J=open air,
#                X=special, P=pickup, E=coupe 2-door, M=monospace/MPV,
#                R=recreational, H=motor home, Y=2-wheel, N=roadster, K=commercial)
#   Position 3: Transmission (M=manual, N=manual 4WD, C=manual AWD,
#                A=automatic, B=auto 4WD, D=auto AWD, E=electric/auto)
#   Position 4: Fuel/Air (R=combustion+AC, D=diesel, H=hybrid, I=plug-in hybrid,
#                E=electric long range, C=electric short range, N=no info)
#
# The default for fuel is R (Combustion Engine + Air). Providers explicitly
# mark hybrid (H) or electric (E/C) when applicable.
#
# La carrocería G (Crossover) no se materializa en nuestra rejilla: todos los
# SUV usan F (SUV/4WD) para máxima cobertura de agrupación entre proveedores
# (validado con Drivalia: C3 Aircross=CFMR, Qashqai=IFMR, 3008=IFAR).
# Premium = tier Elite en 1ª letra; la marca decide (lista cerrada en
# acriss_reference.md). Escala: M·N·E·H·C·D·I·J·S·R·F·G·P·U·L·W·X.
#
# When the LLM does not find a matching code, the PVC is marked
# `pending_review` rather than forced into an inappropriate code.

acriss_codes:

  # ──────────────────────────────────────────────────────────────
  # MINI (M) — City cars, A-segment (≤ ~3,7 m)
  # ──────────────────────────────────────────────────────────────

  - code: MDMR
    display_name: Mini Manual
    description: >
      City car (A-segment, length ≤ 3,7 m), 4/5-door hatchback, manual
      transmission, combustion engine. Mainstream brand. The smallest rental
      tier: Fiat 500, Panda, Picanto. One tier below Economy (Polo/Corsa).
    criteria:
      - "City car / A-segment (length ≤ 3,7 m)"
      - "4-5 doors, minimal rear space"
      - "Manual transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "Fiat 500"
      - "Fiat Panda"
      - "Kia Picanto"
      - "Toyota Aygo"
      - "VW up!"
      - "SEAT Mii"
      - "Škoda Citigo"
      - "Citroën C1"
      - "Peugeot 108"
      - "Renault Twingo"

  - code: MDAR
    display_name: Mini Automático
    description: >
      City car (A-segment, length ≤ 3,7 m), 4/5-door hatchback, automatic
      transmission, combustion engine. Mainstream brand.
    criteria:
      - "City car / A-segment (length ≤ 3,7 m)"
      - "Automatic transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "Hyundai i10 Auto"
      - "Kia Picanto Auto"
      - "VW up! Auto"
      - "Toyota Aygo Auto"

  - code: MDMH
    display_name: Mini Manual Híbrido
    description: >
      City car (A-segment), manual transmission, mild or full hybrid powertrain.
      Same footprint as MDMR but with hybrid drivetrain.
    criteria:
      - "City car / A-segment (length ≤ 3,7 m)"
      - "Manual transmission"
      - "Hybrid powertrain (mild or full HEV)"
      - "Mainstream brand"
    examples:
      - "Fiat Panda Hybrid"

  - code: MBAE
    display_name: Mini Eléctrico
    description: >
      City car (A-segment), 2-3-door body, battery electric (BEV), automatic
      transmission (BEV always auto). Mainstream brand. Validated by Drivalia:
      500e = MBAE ✓.
    criteria:
      - "City car / A-segment (length ≤ 3,7 m)"
      - "2-3 door body"
      - "Battery electric (BEV)"
      - "Automatic transmission (BEV always auto)"
      - "Mainstream brand"
    examples:
      - "Fiat 500e"

  - code: MTMR
    display_name: Mini Descapotable Manual
    description: >
      City-car-based convertible (A-segment platform), manual transmission,
      combustion engine. Soft top, 2-4 seats.
    criteria:
      - "Convertible/cabrio body"
      - "City car / A-segment platform"
      - "Manual transmission"
      - "Combustion engine"
    examples:
      - "Fiat 500C (manual)"

  - code: MTAR
    display_name: Mini Descapotable Automático
    description: >
      City-car-based convertible (A-segment platform), automatic transmission,
      combustion engine.
    criteria:
      - "Convertible/cabrio body"
      - "City car / A-segment platform"
      - "Automatic transmission"
      - "Combustion engine"
    examples:
      - "Fiat 500C (auto)"

  # ──────────────────────────────────────────────────────────────
  # ECONOMY ELITE (H) — Premium-brand B-segment turismo and mini-SUV
  # ──────────────────────────────────────────────────────────────

  - code: HDMR
    display_name: Económico Premium Manual
    description: >
      B-segment supermini of premium brand, manual transmission, combustion
      engine. Same footprint as Economy (Polo/Corsa tier) but premium brand.
      Canonical: Audi A1 (moved here from DDAR — its correct tier by size is
      Economy Elite, not Compact Elite). Distinct from DDMR (A3/Golf-sized).
    criteria:
      - "Supermini / B-segment (~3,9–4,2 m)"
      - "Premium or superior-positioning brand (Audi, Mini, DS, Lancia)"
      - "Sedan, sportback, or hatchback body (NOT SUV)"
      - "Manual transmission"
      - "Combustion engine"
    examples:
      - "Audi A1 (manual)"
      - "Mini 5 puertas (manual)"
      - "DS 3 (manual)"
      - "Lancia Ypsilon (2024, manual)"

  - code: HDAR
    display_name: Económico Premium Automático
    description: >
      B-segment supermini of premium brand, automatic transmission, combustion
      engine. Economy Elite: same footprint as Polo/Corsa but premium brand.
    criteria:
      - "Supermini / B-segment (~3,9–4,2 m)"
      - "Premium or superior-positioning brand (Audi, Mini, DS, Lancia)"
      - "Sedan, sportback, or hatchback body (NOT SUV)"
      - "Automatic transmission"
      - "Combustion engine"
    examples:
      - "Audi A1 Auto"
      - "Mini 5 puertas Auto"
      - "DS 3 Auto"
      - "Lancia Ypsilon Auto"

  - code: HFMR
    display_name: SUV Urbano Premium Manual
    description: >
      Small premium-brand SUV (~4,0–4,25 m), manual transmission, combustion
      engine. Economy Elite SUV: espejo SUV del HDMR. Q2 sits below Q3 in
      Audi's own range, so it belongs here rather than at DFMR.
    criteria:
      - "Small premium SUV (~4,0–4,25 m)"
      - "Premium brand (Audi, DS)"
      - "Manual transmission"
      - "Combustion engine"
      - "Below the compact premium SUV tier (DFMR)"
    examples:
      - "Audi Q2 (manual)"
      - "DS3 Crossback (manual)"

  - code: HFAR
    display_name: SUV Urbano Premium Automático
    description: >
      Small premium-brand SUV (~4,0–4,25 m), automatic transmission, combustion
      engine. Economy Elite SUV: espejo SUV del HDAR. Audi Q2 migrates here from
      DFAR — two Audi SUVs cannot share a tier; Q3 stays at DFAR.
    criteria:
      - "Small premium SUV (~4,0–4,25 m)"
      - "Premium brand (Audi, DS)"
      - "Automatic transmission"
      - "Combustion engine"
      - "Below the compact premium SUV tier (DFAR)"
    examples:
      - "Audi Q2"
      - "DS3 Crossback"

  # ──────────────────────────────────────────────────────────────
  # ECONOMY (E) — B-segment superminis: hatchback, eléctrico, wagon, SUV urbano
  # ──────────────────────────────────────────────────────────────

  - code: EDMR
    display_name: Económico Manual
    description: >
      B-segment supermini hatchback (~3,9–4,2 m), manual transmission, combustion
      engine. Mainstream brand. One tier above Mini (city car ≤ 3,7 m) and one
      below Compact (Golf ~4,28 m). Validated: Drivalia 208=EDMR ✓.
    criteria:
      - "Supermini / B-segment (~3,9–4,2 m)"
      - "5-door hatchback, 5 seats"
      - "Manual transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "VW Polo"
      - "Opel Corsa"
      - "Peugeot 208"
      - "Renault Clio"
      - "Citroën C3"
      - "SEAT Ibiza"
      - "Toyota Yaris"
      - "Suzuki Swift"
      - "Ford Fiesta"

  - code: EDAR
    display_name: Económico Automático
    description: >
      B-segment supermini hatchback (~3,9–4,2 m), automatic transmission,
      combustion engine. Mainstream brand. Validated: Drivalia MG3=EDAR ✓.
    criteria:
      - "Supermini / B-segment (~3,9–4,2 m)"
      - "Automatic transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "Peugeot 208 Auto"
      - "Opel Corsa Auto"
      - "Hyundai i20 Auto"
      - "Renault Clio Auto"
      - "Toyota Yaris Auto"
      - "Suzuki Swift Auto"
      - "SEAT Ibiza Auto"
      - "MG MG3"

  - code: EDAE
    display_name: Económico Eléctrico
    description: >
      B-segment supermini, battery electric (BEV), automatic transmission.
      Mainstream brand. Economy-size BEV at supermini footprint (~4,0–4,1 m).
    criteria:
      - "Supermini / B-segment (~3,9–4,2 m)"
      - "Battery electric (BEV)"
      - "Automatic transmission (BEV always auto)"
      - "Mainstream brand"
    examples:
      - "Peugeot e-208"
      - "Opel Corsa-e"
      - "Renault Zoe"

  - code: EWMR
    display_name: Económico Familiar Manual
    description: >
      B-segment supermini estate/wagon, manual transmission, combustion engine.
      Mainstream brand. Inherits Economy tier from its hatchback platform base.
    criteria:
      - "Wagon/estate body"
      - "B-segment / supermini platform base"
      - "Manual transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "Škoda Fabia Combi (manual)"

  - code: EWAR
    display_name: Económico Familiar Automático
    description: >
      B-segment supermini estate/wagon, automatic transmission, combustion engine.
