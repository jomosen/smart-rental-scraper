      previously split between CDAR and IDMR — now all C-segment in CDMR/CDAR.
      Validated: Drivalia Focus=CDMR ✓.
    criteria:
      - "Compact / C-segment (~4,25–4,45 m)"
      - "5-door hatchback or sedan"
      - "Manual transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "VW Golf"
      - "Ford Focus"
      - "Opel Astra"
      - "Peugeot 308"
      - "SEAT León"
      - "Renault Mégane"
      - "Hyundai i30"
      - "Toyota Corolla"
      - "Kia Ceed"
      - "Škoda Scala"

  - code: CDAR
    display_name: Compacto Automático
    description: >
      C-segment compact hatchback/sedan (~4,25–4,55 m), automatic transmission,
      combustion engine. Mainstream brand. Commercial segment manda over cm:
      Honda Civic (4,55) and Mazda 3 (4,46) stay in C because they are
      commercially C-segment cars. Validated: Drivalia C4=CDAR ✓.
    criteria:
      - "Compact / C-segment (~4,25–4,55 m, segment manda)"
      - "Automatic transmission"
      - "Combustion engine"
      - "Mainstream brand"
    examples:
      - "VW Golf Auto"
      - "Ford Focus Auto"
      - "Opel Astra Auto"
      - "Peugeot 308 Auto"
      - "SEAT León Auto"
      - "Renault Mégane Auto"
      - "Toyota Corolla Auto"
      - "Honda Civic Auto"
      - "Mazda 3 Auto"

