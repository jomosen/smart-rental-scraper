    display_name: Compacto Híbrido Automático
    description: >
      C-segment compact, full hybrid (HEV), automatic transmission.
      Mainstream brand. The most common compact hybrid in rental fleets.
    criteria:
      - "Compact / C-segment (~4,25–4,55 m)"
      - "Full or mild hybrid powertrain (HEV)"
