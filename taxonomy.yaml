# taxonomy.yaml
#
# Operator's canonical vehicle taxonomy. Source of truth for the
# `canonical_vehicle_types` table in the database.
#
# Maintained by the operator (this file lives in git, versioned).
# Changes are applied to the database by `scripts/seed_taxonomy.py`,
# which is idempotent.
#
# Conventions:
#
#   * Each category has a unique `code` (uppercase snake_case).
#   * `name` is the human-readable label shown to tenants who do
#     NOT declare their own `tenant_vehicle_groups`.
#   * `description` is the operative definition: what defines this
#     category functionally for rent-a-car operations.
#   * `criteria` lists the cues an LLM (or a human classifier)
#     should use to assign a provider's vehicle to this category.
#   * `examples` are illustrative models commonly seen in this
#     category across providers.
#
# Naming convention for codes:
#
#   * Default body = "passenger" (hatchback/sedan/turismo). NOT
#     written in the code. e.g. ECONOMY_AUTO is a passenger car.
#   * Non-default body explicit in the code: SUV, CONVERTIBLE,
#     VAN_7, VAN_9, COMMERCIAL, MOTORCYCLE.
#   * Transmission suffix: MANUAL or AUTO. Always written.
#   * Exception: MOTORCYCLE carries no transmission suffix.
#
# Versioning:
#
#   * `taxonomy_version` increments with each meaningful change.
#   * Adding a new category: bump version.
#   * Refining a description that significantly affects what falls
#     into the category: bump version. Otherwise, no bump.
#   * Deprecating a category: bump version. Set `active: false`.
#     Rows in the database referencing it remain; they get
#     re-classified by the next seed run with `reclassify: true`
#     or by the next scrape, whichever comes first.

taxonomy_version: 1

categories:

  # ─────────────────────────────────────────────────────────────────
  # ECONOMY — Small urban cars, 5 seats, manual or automatic
  # ─────────────────────────────────────────────────────────────────

  - code: ECONOMY_MANUAL
    name: "Económico manual"
    description: >
      Small urban cars with manual transmission. 5 seats, 1-2
      luggage pieces. The cheapest tier of the passenger market.
    criteria:
      - "Small urban hatchbacks (Fiat Panda, Kia Picanto, Opel Corsa)"
      - "5 seats, 1-2 luggage pieces typical"
      - "Manual transmission"
      - "Engine displacement <= 1.4L typical"
    examples:
      - "Fiat Panda"
      - "Kia Picanto"
      - "Opel Corsa"
      - "Hyundai i10"
      - "Skoda Fabia (base)"

  - code: ECONOMY_AUTO
    name: "Económico automático"
    description: >
      Same segment as ECONOMY_MANUAL but with automatic
      transmission. Often slightly larger in displacement to
      accommodate the gearbox, but still in the smallest urban
      passenger segment.
    criteria:
      - "Small urban hatchbacks with automatic transmission"
      - "5 seats, 1-2 luggage pieces"
      - "Toyota Yaris Auto, Suzuki Swift Auto, Peugeot 208 Auto"
    examples:
      - "Toyota Yaris (auto)"
      - "Suzuki Swift (auto)"
      - "Peugeot 208 (auto)"
      - "Hyundai i20 (auto)"

  # ─────────────────────────────────────────────────────────────────
  # COMPACT — Medium urban / family hatchbacks and small crossovers
  # ─────────────────────────────────────────────────────────────────

  - code: COMPACT_MANUAL
    name: "Compacto manual"
    description: >
      Medium-sized urban or small family cars. 5 seats, 3 luggage
      pieces typical. The next step up from ECONOMY, common as
      family commuter or business rental.
    criteria:
      - "Medium hatchbacks or small crossovers"
      - "5 seats, 3 luggage pieces typical"
      - "Manual transmission"
    examples:
      - "VW Polo"
      - "Opel Corsa (newer larger versions)"
      - "Citroën C3"
      - "Seat Arona (manual)"
      - "Renault Clio"

  - code: COMPACT_AUTO
    name: "Compacto automático"
    description: >
      Same segment as COMPACT_MANUAL but with automatic
      transmission. Includes urban-oriented small crossovers with
      automatic.
    criteria:
      - "Medium hatchbacks or small crossovers with automatic"
      - "5 seats, 3 luggage pieces"
      - "Not yet a full SUV (no high ride, no SUV silhouette)"
    examples:
      - "Ford Puma (auto)"
      - "Fiat 600"
      - "Renault Captur (auto)"
      - "Hyundai Bayon (auto)"

  - code: COMPACT_SUV_AUTO
    name: "Compacto SUV automático"
    description: >
      Compact-sized SUVs with automatic transmission. Smaller than
      INTERMEDIATE_SUV but with full SUV silhouette and ride
      height.
    criteria:
      - "Small to compact SUV body"
      - "5 seats, 3-4 luggage pieces"
      - "Automatic transmission"
    examples:
      - "Skoda Kamiq"
      - "VW T-Cross"
      - "Hyundai Kona"
      - "Mazda CX-30"

  # ─────────────────────────────────────────────────────────────────
  # INTERMEDIATE — Mid-size sedans and hatchbacks
  # ─────────────────────────────────────────────────────────────────

  - code: INTERMEDIATE_MANUAL
    name: "Intermedio manual"
    description: >
      Mid-sized sedans, hatchbacks, or small crossovers. 5 seats,
      3-4 luggage pieces. One step above COMPACT — meaningful
      size and comfort upgrade. Typical mid-range business or
      family rental.
    criteria:
      - "Mid-size hatchback, sedan, or compact crossover"
      - "5 seats, 3-4 luggage pieces typical"
      - "Manual transmission"
    examples:
      - "Audi A1"
      - "Ford Focus"
      - "Opel Astra"
      - "Opel Crossland"
      - "Seat Leon (manual)"

  - code: INTERMEDIATE_AUTO
    name: "Intermedio automático"
    description: >
      Mid-sized cars with automatic transmission. Includes
      crossovers that are larger than COMPACT_SUV_AUTO but not
      yet full STANDARD_SUV size.
    criteria:
      - "Mid-size cars or compact crossovers, automatic"
      - "5 seats, 3-4 luggage pieces"
    examples:
      - "Kia Ceed SW (auto)"
      - "Opel Grandland"
      - "Peugeot 2008"
      - "Kia XCeed (auto)"
      - "Hyundai i30 (auto)"

  # ─────────────────────────────────────────────────────────────────
  # STANDARD — Full-size family cars and mid SUVs
  # ─────────────────────────────────────────────────────────────────

  - code: STANDARD_SUV_AUTO
    name: "Estándar SUV automático"
    description: >
      Full-size family SUVs with automatic transmission. The
      mainstream family-SUV segment: more cargo space than
      INTERMEDIATE, more practical for trips and large families.
    criteria:
      - "Mid-size to full-size SUV"
      - "5 seats, 4-5 luggage pieces"
      - "Automatic transmission"
      - "Common brands: VW, Ford, Renault, Hyundai, Kia"
    examples:
      - "VW Tiguan"
      - "VW T-Roc"
      - "Ford Kuga"
      - "Hyundai Tucson"
      - "Renault Espace (Hertz Estándar SUV)"

  # ─────────────────────────────────────────────────────────────────
  # PREMIUM — Premium-brand cars
  # ─────────────────────────────────────────────────────────────────

  - code: PREMIUM_AUTO
    name: "Premium automático"
    description: >
      Premium-brand passenger cars (sedans, hatchbacks). Brand is
      a key signal: Mercedes, BMW, Audi, Lexus, etc. Not SUV body
      (those are PREMIUM_SUV_AUTO).
    criteria:
      - "Premium-brand badge: Mercedes-Benz, BMW, Audi, Lexus, "
        "Infiniti, Genesis, Volvo (some)"
      - "Sedan or hatchback body"
      - "Automatic transmission"
      - "5 seats, 3-4 luggage pieces"
    examples:
      - "Mercedes Clase C"
      - "BMW Serie 3"
      - "Audi A4"
      - "Lexus IS"

  - code: PREMIUM_SUV_AUTO
    name: "Premium SUV automático"
    description: >
      Premium-brand SUVs and SUV-coupés. Brand and body together
      signal this category.
    criteria:
      - "Premium-brand badge AND SUV body"
      - "5 seats, 3-4 luggage pieces"
      - "Mercedes GLA/GLB/GLC, BMW X1/X3, Audi Q3/Q5"
    examples:
      - "Mercedes GLA"
      - "Mercedes GLC"
      - "Mercedes GLC Coupé"
      - "BMW X1"
      - "BMW X3"
      - "Audi Q5"

  # ─────────────────────────────────────────────────────────────────
  # VAN — Passenger vans (7 or 9 seats)
  # ─────────────────────────────────────────────────────────────────

  - code: VAN_7_AUTO
    name: "Furgoneta 7 plazas automática"
    description: >
      Passenger vans or large 7-seater SUVs with automatic
      transmission. The defining feature is 7 seats with passenger
      orientation (windows, comfortable interior). Not a cargo
      conversion.
    criteria:
      - "7 seats"
      - "Passenger orientation (windows on sides, full seats)"
      - "Automatic transmission"
      - "Often classified by providers as 'Mini-van pasajeros'"
        " or 'SUV 7-seater'"
    examples:
      - "BMW Serie 2 Gran Tourer"
      - "Mercedes GLB"
      - "Mercedes Clase V (7 seats)"
      - "Ford Tourneo Connect 7p"
      - "DFSK 580 (7 seats)"

  - code: VAN_9_MANUAL
    name: "Furgoneta 9 plazas manual"
    description: >
      Passenger vans with 9 seats and manual transmission. Common
      configuration for tourism rentals (large groups, airport
      shuttles, multi-family trips).
    criteria:
      - "9 seats"
      - "Passenger orientation"
      - "Manual transmission"
    examples:
      - "Opel Vivaro 9p"
      - "Ford Transit Custom 9p"

  - code: VAN_9_AUTO
    name: "Furgoneta 9 plazas automática"
    description: >
      Same segment as VAN_9_MANUAL but with automatic
      transmission. Premium-end of the 9-seat passenger van
      market.
    criteria:
      - "9 seats"
      - "Passenger orientation"
      - "Automatic transmission"
    examples:
      - "Mercedes Vito 9p (auto)"
      - "Mercedes Clase V 9p (auto)"

  # ─────────────────────────────────────────────────────────────────
  # COMMERCIAL — Cargo-oriented vans
  # ─────────────────────────────────────────────────────────────────

  - code: COMMERCIAL_MANUAL
    name: "Comercial manual"
    description: >
      Cargo-oriented vans with manual transmission. The interior
      is configured for cargo, not for passenger comfort. May
      have 5 passenger seats up front but the rear is cargo
      space.
    criteria:
      - "Cargo van body"
      - "Up to 5 passenger seats (typically just 2-5 up front)"
      - "Large cargo bay (luggage typically >= 5 pieces in count "
        "or expressed in m³)"
      - "Manual transmission"
    examples:
      - "Peugeot Rifter"
      - "Citroën Berlingo"
      - "Fiat Doblo (cargo)"

  # ─────────────────────────────────────────────────────────────────
  # MOTORCYCLE — Two-wheel vehicles
  # ─────────────────────────────────────────────────────────────────

  - code: MOTORCYCLE
    name: "Motocicleta"
    description: >
      Two-wheel vehicles. Includes scooters, motorcycles, mopeds.
      Single category for the entire motorcycle market regardless
      of displacement or type.
    criteria:
      - "Two wheels"
      - "Typically 2 seats (rider + passenger)"
      - "Engine displacement varies (50cc to >1000cc)"
    examples:
      - "Yamaha Ray ZR 125"
      - "Vespa GTS"
      - "BMW R 1250"

# ─────────────────────────────────────────────────────────────────
# Initial classification of existing provider groups
#
# Used by the seed script on first run to populate
# provider_vehicle_categories.canonical_type_id for the 33 rows
# already in the database (Solcar + Victoria, as of taxonomy_version 1).
#
# Format:
#   - provider_code: matches providers.code in the database.
#   - external_code: matches provider_vehicle_groups.external_code
#                    (now provider_vehicle_categories.external_code
#                    after the rename).
#   - canonical_type_code: must reference a category above.
#   - confidence: assigned by the operator at classification time.
#                 Used to seed provider_vehicle_categories.classification_confidence.
#   - rationale: human-readable note for audit. Not persisted.
#
# After v1, new classifications happen automatically via the LLM
# during scrapes. This section serves only for the seed migration.
# ─────────────────────────────────────────────────────────────────

